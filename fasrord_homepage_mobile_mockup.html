<div style="max-width:360px;margin:0 auto;background:var(--surface-1);border-radius:28px;padding:10px;border:0.5px solid var(--border)">
<div style="background:var(--surface-2);border-radius:20px;overflow:hidden">

<div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:0.5px solid var(--border)">
  <span style="font-size:16px;font-weight:500;letter-spacing:0.5px">FASRORD</span>
  <div style="display:flex;gap:14px">
    <i class="ti ti-search" style="font-size:18px" aria-hidden="true"></i>
    <i class="ti ti-heart" style="font-size:18px" aria-hidden="true"></i>
    <i class="ti ti-shopping-bag" style="font-size:18px" aria-hidden="true"></i>
  </div>
</div>

<div style="display:flex;gap:8px;padding:12px 16px;overflow-x:auto">
  <span style="font-size:12px;padding:5px 12px;border-radius:14px;background:var(--bg-accent);color:var(--text-accent);white-space:nowrap">New drop</span>
  <span style="font-size:12px;padding:5px 12px;border-radius:14px;border:0.5px solid var(--border-strong);white-space:nowrap">Streetwear</span>
  <span style="font-size:12px;padding:5px 12px;border-radius:14px;border:0.5px solid var(--border-strong);white-space:nowrap">Y2K</span>
  <span style="font-size:12px;padding:5px 12px;border-radius:14px;border:0.5px solid var(--border-strong);white-space:nowrap">Basketball</span>
</div>

<div style="margin:0 16px 14px;border-radius:14px;background:var(--surface-1);padding:14px;display:flex;align-items:center;justify-content:space-between">
  <div>
    <p style="font-size:13px;font-weight:500;margin:0 0 2px">Next drop</p>
    <p style="font-size:12px;color:var(--text-secondary);margin:0">Summer collection</p>
  </div>
  <span style="font-size:13px;font-weight:500;color:var(--text-accent)">2j 04h</span>
</div>

<div style="position:relative;margin:0 16px 14px;border-radius:16px;overflow:hidden;height:200px;background:var(--surface-1);display:flex;align-items:center;justify-content:center">
  <i class="ti ti-player-play" style="font-size:30px;color:var(--text-muted)" aria-hidden="true"></i>
  <span style="position:absolute;top:10px;left:10px;font-size:11px;padding:3px 8px;border-radius:10px;background:var(--bg-danger);color:var(--text-danger)">Trending</span>
</div>

<p style="font-size:13px;font-weight:500;margin:0 16px 8px">Complete the fit</p>
<div style="display:flex;gap:10px;padding:0 16px 16px;overflow-x:auto">
  <div style="min-width:110px;background:var(--surface-1);border-radius:12px;padding:8px">
    <div style="height:90px;border-radius:8px;background:var(--surface-0);margin-bottom:6px"></div>
    <p style="font-size:12px;margin:0">Oversized tee</p>
    <p style="font-size:12px;color:var(--text-secondary);margin:0">45 DT</p>
  </div>
  <div style="min-width:110px;background:var(--surface-1);border-radius:12px;padding:8px">
    <div style="height:90px;border-radius:8px;background:var(--surface-0);margin-bottom:6px"></div>
    <p style="font-size:12px;margin:0">Baggy short</p>
    <p style="font-size:12px;color:var(--text-secondary);margin:0">55 DT</p>
  </div>
  <div style="min-width:110px;background:var(--surface-1);border-radius:12px;padding:8px">
    <div style="height:90px;border-radius:8px;background:var(--surface-0);margin-bottom:6px"></div>
    <p style="font-size:12px;margin:0">Hoodie Y2K</p>
    <p style="font-size:12px;color:var(--text-secondary);margin:0">89 DT</p>
  </div>
</div>

<p style="font-size:13px;font-weight:500;margin:0 16px 8px">Seen on Instagram</p>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;padding:0 16px 16px">
  <div style="aspect-ratio:1;background:var(--surface-1);border-radius:6px"></div>
  <div style="aspect-ratio:1;background:var(--surface-1);border-radius:6px"></div>
  <div style="aspect-ratio:1;background:var(--surface-1);border-radius:6px"></div>
</div>

<div style="display:flex;justify-content:space-around;padding:12px 0;border-top:0.5px solid var(--border)">
  <i class="ti ti-home" style="font-size:20px" aria-hidden="true"></i>
  <i class="ti ti-category" style="font-size:20px;color:var(--text-secondary)" aria-hidden="true"></i>
  <i class="ti ti-heart" style="font-size:20px;color:var(--text-secondary)" aria-hidden="true"></i>
  <i class="ti ti-user" style="font-size:20px;color:var(--text-secondary)" aria-hidden="true"></i>
</div>

</div>
</div>
